log_format agentpay_arc_json escape=json
    '{"time":"$time_iso8601","host":"$server_name","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"remote":"$remote_addr"}';

limit_req_zone $binary_remote_addr zone=agentpay_arc_web:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=agentpay_arc_mcp:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name arc.agentpay.site;
    return 308 https://arc.agentpay.site$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.arc.agentpay.site;
    return 308 https://mcp.arc.agentpay.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arc.agentpay.site;
    if ($host != arc.agentpay.site) { return 421; }

    ssl_certificate /etc/letsencrypt/live/arc.agentpay.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arc.agentpay.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/agentpay-arc/web-access.jsonl agentpay_arc_json;
    error_log /var/log/agentpay-arc/web-error.log warn;
    server_tokens off;
    client_max_body_size 64k;
    limit_req zone=agentpay_arc_web burst=40 nodelay;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host mcp.arc.agentpay.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host arc.agentpay.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.arc.agentpay.site;
    if ($host != mcp.arc.agentpay.site) { return 421; }

    ssl_certificate /etc/letsencrypt/live/mcp.arc.agentpay.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.arc.agentpay.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/agentpay-arc/mcp-access.jsonl agentpay_arc_json;
    error_log /var/log/agentpay-arc/mcp-error.log warn;
    server_tokens off;
    client_max_body_size 64k;
    limit_req zone=agentpay_arc_mcp burst=20 nodelay;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /mcp {
        proxy_pass http://127.0.0.1:3102/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host mcp.arc.agentpay.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host mcp.arc.agentpay.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /.well-known/oauth-protected-resource {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host mcp.arc.agentpay.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host mcp.arc.agentpay.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
    }

    location = /healthz {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3102/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host mcp.arc.agentpay.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
    }

    location = /readyz {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3102/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host mcp.arc.agentpay.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
    }

    location / {
        return 404;
    }
}
